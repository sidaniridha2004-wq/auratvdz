name: Remove obsolete player sandbox

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-player-sandbox.yml"

permissions:
  contents: write

jobs:
  patch-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove sandbox from the player source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          player = Path("src/components/VodPlayer.tsx")
          text = player.read_text(encoding="utf-8")
          block = '''            // No allow-popups / allow-top-navigation: third-party players
                      // cannot open ad tabs or hijack the page. Playback still works.
                      sandbox="allow-scripts allow-same-origin allow-forms allow-presentation allow-pointer-lock"
          '''
          if block in text:
              player.write_text(text.replace(block, "", 1), encoding="utf-8")
          elif "sandbox=" in text:
              raise SystemExit("Unexpected sandbox syntax; refusing an unsafe broad edit")

          workflow = Path(".github/workflows/remove-player-sandbox.yml")
          if workflow.exists():
              workflow.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove iframe sandbox from VOD player"
          git push
